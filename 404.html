<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · ArticleGuessr</title>
<meta name="robots" content="noindex">
<style>
  /* Self-contained on purpose: a 404 can be served from any URL depth, where relative asset paths would break. */
  :root{--paper:#E7EBE5;--ink:#16201C;--accent:#F4D03F;color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root{--paper:#0F1512;--ink:#E7EBE5}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif}
  main{max-width:32rem}
  p.code{margin:0 0 .5rem;font:400 .875rem ui-monospace,"Courier New",monospace;opacity:.75}
  h1{margin:0;font:200 clamp(2.5rem,9vw,4rem)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.02em}
  h1 strong{font-weight:700}
  p{margin:1rem 0 1.5rem}
  a{display:inline-block;padding:.75rem 1.5rem;font-weight:700;color:var(--paper);background:var(--ink);border:2px solid var(--ink);text-decoration:none}
  a:hover,a:focus-visible{color:#16201C;background:var(--accent)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>That page<br><strong>doesn’t exist.</strong></h1>
  <p>The link may be mistyped or out of date. Today’s categories are waiting.</p>
  <a href="/">Back to the game</a>
</main>
</body>
</html>
